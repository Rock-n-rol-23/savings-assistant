/* rebalancing engine calculator */
const calc=$('#calc');
if(calc){const reserve=$('#c-reserve'),block=$('#c-block'),bonus=$('#c-bonus'),thr=$('#c-thr');
 function run(){const res=+reserve.value;const idle=400000,sav=450000,dep=1600000,total=idle+sav+dep;const mv=Math.max(0,idle-res);
  const acts=[];if(mv>0)acts.push({t:`${fmt(mv)} ₽ с карты → накопительный счёт`,g:mv*0.1125,m:'в год'});
  if(!block.checked)acts.push({t:'Переоткрыть вклад ••8708 под 12,2% вместо 7,5%',g:400000*(0.122-0.075)*0.5,m:'за 6 месяцев'});
  if(bonus.checked)acts.push({t:'Надбавка за покупки +1,5% на накопительном (450 000 ₽)',g:sav*0.015,m:'в год'});
  const th=+thr.value;const kept=acts.filter(a=>a.g/12>=th);const dropped=acts.length-kept.length;const tot=kept.reduce((s,a)=>s+a.g,0);
  const effB=(sav+1200000)/total;const effA=(sav+mv+(block.checked?0:400000)+800000+400000)/total;
  $('#c-reserve-v').textContent=fmt(res)+' ₽';
  $('#c-acts').innerHTML=kept.map(a=>`<div class="o"><span>${a.t}</span><b>+${fmt(a.g)} ₽ <span style="font-weight:400;color:var(--ink3)">${a.m}</span></b></div>`).join('')+(dropped?`<div class="o" style="color:var(--ink3)"><span>Скрыто предложений ниже порога выгоды</span><b>${dropped}</b></div>`:'');
  $('#c-total').textContent='+'+fmt(tot)+' ₽';$('#c-eff').textContent=Math.round(effB*100)+'% → '+Math.round(effA*100)+'%';
  const idleA=idle-mv,savA=sav+mv;
  $('#c-before').innerHTML=`<i class="idle" style="width:${idle/total*100}%"></i><i class="sav" style="width:${sav/total*100}%"></i><i class="dep" style="width:${dep/total*100}%"></i>`;
  $('#c-after').innerHTML=`<i class="idle" style="width:${idleA/total*100}%"></i><i class="sav" style="width:${savA/total*100}%"></i><i class="dep" style="width:${dep/total*100}%"></i>`;}
 [reserve,block,bonus,thr].forEach(el=>el.addEventListener('input',run));run();}

/* service vs rate: the best market rate without the assistant against our rate with closed leaks */
const edge=$('#edge-calc');
if(edge){const comp=$('#e-comp'),sw=$('#e-switch');const DEP=1600000,TOTAL=2450000,BASE=12.2,SWITCH=3360;
 const LEAKS=[['e-idle','спящие деньги',45000,'var(--accent)'],['e-prolong','тихое продление',18800,'#5BD67E'],['e-gap','простой между вкладами',6400,'var(--c-sav)'],['e-early','сгоревшие проценты',3200,'var(--ai)'],['e-bonus','условие надбавки',2250,'#A48BFF'],['e-tax','налог',3900,'#C9B8FF']];
 const pct=v=>v.toFixed(1).replace('.',',')+'%';
 function run(){const c=+comp.value;const gain=Math.max(0,c-BASE)/100*DEP;const cost=sw.checked&&c>BASE?SWITCH:0;const theirs=gain-cost;
  const on=LEAKS.filter(l=>$('#'+l[0]).checked);const ours=on.reduce((s,l)=>s+l[2],0);
  const mx=Math.max(gain,ours,1);const seg=(w,bg)=>`<i style="width:${Math.max(0,w)/mx*100}%;background:${bg}"></i>`;
  $('#e-bar-theirs').innerHTML=seg(gain-cost,'#8C9A92')+(cost?seg(cost,'var(--warn)'):'');
  $('#e-bar-ours').innerHTML=on.map(l=>seg(l[2],l[3])).join('');
  $('#e-legend').innerHTML=`<span><i style="background:#8C9A92"></i>ставка выше на ${(Math.max(0,c-BASE)).toFixed(1).replace('.',',')} п.п.</span>`+(cost?`<span><i style="background:var(--warn)"></i>цена перехода ${fmt(cost)}</span>`:'')+on.map(l=>`<span><i style="background:${l[3]}"></i>${l[1]} ${fmt(l[2])}</span>`).join('');
  $('#e-comp-v').textContent=pct(c);$('#e-theirs').textContent=(theirs<0?'−':'+')+fmt(Math.abs(theirs))+' ₽';$('#e-ours').textContent='+'+fmt(ours)+' ₽';
  const d=ours-theirs;const v=$('#e-verdict');const be=BASE+(ours+(sw.checked?SWITCH:0))/DEP*100;
  if(d>=0){v.className='verdict';v.textContent=`С помощником на ${fmt(d)} ₽ в год больше при ставке конкурента ${pct(c)}. Чтобы перебить сервис одной ставкой, конкуренту нужно ${pct(be)}.`;}
  else{v.className='verdict warn';v.textContent=`Честно: у этого клиента утечек почти нет, и ставка конкурента выгоднее на ${fmt(-d)} ₽ в год. Помощник так и скажет и перенесёт деньги в день закрытия без простоя.`;}
  $('#e-money').textContent=`Ставка конкурента действует на ${fmt(DEP)} ₽ вкладов и на срок вклада. Утечки считаются по всем ${fmt(TOTAL)} ₽ клиента и за весь год.`;}
 [comp,sw,...LEAKS.map(l=>$('#'+l[0]))].forEach(el=>el.addEventListener('input',run));run();}

const vcal=$('#val-calc');
if(vcal){
 const MON=['окт','ноя','дек','янв','фев','мар','апр','май','июн','июл','авг','сен'];
 const TOUCH=[
  {m:0,t:'Спящие 250 000 ₽ → счёт',v:28100},{m:0,t:'Вклад в другом банке закрывается: перенести без простоя',v:6400},{m:0,t:'Надбавка под угрозой',v:560},
  {m:1,t:'Проценты пришли',v:0},
  {m:2,t:'Закрытие ••8708: три варианта',v:18800,must:true},{m:2,t:'Автодействие завтра',v:0,must:true,biz:'контроль'},
  {m:3,t:'Премия: спящие 150 000 ₽ → счёт',v:16900},{m:3,t:'Надбавка под угрозой',v:560},
  {m:4,t:'Проценты пришли',v:0},
  {m:5,t:'Налог: перенести выплату',v:3910},{m:5,t:'Закрытие ••5520: три варианта',v:0,must:true,biz:'удержание 800 000 ₽'},
  {m:6,t:'Надбавка под угрозой',v:560},
  {m:7,t:'Проценты пришли',v:0},{m:7,t:'Нужны 50 000 ₽: откуда взять без потери',v:3200,must:true},
  {m:8,t:'Цель достигнута',v:0},
  {m:9,t:'Закрытие ••1234: три варианта',v:0,must:true,biz:'удержание 400 000 ₽'},{m:9,t:'Надбавка под угрозой',v:560},
  {m:10,t:'Проценты пришли',v:0}
 ];
 const TOTAL=TOUCH.reduce((s,t)=>s+t.v,0);const MUST=TOUCH.filter(t=>t.must).length;
 function run(){const nb=$('.vb-n.on',vcal);const n=nb?+nb.dataset.n:1;const merge=$('#v-merge').checked,nice=$('#v-nice').checked,thr=+$('#v-thr').value;
  let got=0,msgs=0;const dropped=[];const byM=MON.map(()=>[]);TOUCH.forEach(t=>byM[t.m].push(t));
  const html=byM.map((list,mi)=>{const must=list.filter(t=>t.must),disc=list.filter(t=>!t.must).sort((a,b)=>b.v-a.v);const cap=merge?3*n:n;let used=0;const items=[];
   must.forEach(t=>{got+=t.v;msgs++;items.push([t,true]);});
   disc.forEach(t=>{const ok=(t.v?t.v>=thr:nice)&&used<cap;if(ok){used++;got+=t.v;}else dropped.push(t);items.push([t,ok]);});
   msgs+=merge?Math.ceil(used/3):used;
   return `<div class="ym"><b>${MON[mi]}</b>${items.map(([t,on])=>`<span class="yt${t.must?' must':t.v?'':' zero'}${on?'':' off'}">${t.t}<small>${t.v?'+'+fmt(t.v)+' ₽':(t.biz||'без цифры')}</small></span>`).join('')||'<span class="q">тишина</span>'}</div>`;}).join('');
  $('#v-grid').innerHTML=html;
  const pct=Math.round(got/TOTAL*100);$('#v-got').textContent='+'+fmt(got)+' ₽';$('#v-pct').textContent=`${pct}% из ${fmt(TOTAL)} ₽ возможных`;$('#v-msgs').textContent=`${msgs}, из них ${MUST} обязательных`;
  const dv=dropped.filter(t=>t.v),lost=dv.reduce((s,t)=>s+t.v,0);const v=$('#v-verdict');
  if(!lost){v.className='verdict';v.textContent=merge?`Собрано всё: ${msgs} сообщений за год, в среднем ${fmt(got/msgs)} ₽ на касание. Объединение событий недели даёт 100% даже при одном предложении в месяц.`:`Собрано всё: ${msgs} сообщений за год, ${fmt(got/msgs)} ₽ на касание. Столько же ценности даёт одно сообщение в месяц, если объединять события недели.`;}
  else{v.className='verdict warn';v.textContent=`Собрано ${pct}%. Клиент теряет ${fmt(lost)} ₽ в год на событиях, о которых мы промолчали${merge?'':'. Включите объединение событий недели: один план вместо трёх пушей собирает всё'}.`;}
  $('#v-drop').textContent=dv.length?`Промолчали: ${dv.map(t=>t.t.toLowerCase()+' ('+fmt(t.v)+' ₽)').join(', ')}.`:(dropped.length?`Промолчали только о событиях без цифры: ${dropped.map(t=>t.t.toLowerCase()).filter((x,i,a)=>a.indexOf(x)===i).join(', ')}.`:'Отправлено всё, включая приятное без решения.');}
 $$('.vb-n',vcal).forEach(b=>b.addEventListener('click',()=>{$$('.vb-n',vcal).forEach(x=>x.classList.toggle('on',x===b));run();}));
 ['v-merge','v-nice','v-thr'].forEach(id=>$('#'+id).addEventListener('input',run));run();
}

/* nav highlight + scroll reveal */
const links=$$('.links a');const secs=links.map(a=>$(a.getAttribute('href'))).filter(Boolean);
const grps=$$('.links .grp');function closeGrps(){grps.forEach(g=>{g.classList.remove('open');$('button',g).setAttribute('aria-expanded','false')})}
grps.forEach(g=>{const b=$('button',g);b.addEventListener('click',e=>{const open=!g.classList.contains('open');closeGrps();if(open){g.classList.add('open');b.setAttribute('aria-expanded','true')}e.stopPropagation();});$$('a',g).forEach(a=>a.addEventListener('click',closeGrps));});
document.addEventListener('click',closeGrps);addEventListener('keydown',e=>{if(e.key==='Escape')closeGrps()});
if('IntersectionObserver' in window){if(secs.length){const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));grps.forEach(g=>g.classList.toggle('on',!!$('a.on',g)));}})},{rootMargin:'-40% 0px -55% 0px'});secs.forEach(s=>io.observe(s));}

})();

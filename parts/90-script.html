function tpl(id){return document.querySelector('template[data-screen="'+id+'"]')}
class Proto{
 constructor(root,flow,opts){opts=opts||{};this.root=root;this.screen=$('.screen',root);this.hist=[];this.cur=null;this.flow=flow;this.static=!!opts.static;this.listeners=[];this.timers=[];
  if(!this.static){root.addEventListener('click',e=>this.onClick(e));}}
 on(fn){this.listeners.push(fn)}
 emit(){this.listeners.forEach(f=>f(this.cur,this))}
 build(id){const t=tpl(id);if(!t)return null;const base=t.dataset.base?tpl(t.dataset.base):null;const main=base||t;
  let html='';const bg=main.dataset.bg;if(bg)html+=`<div class="${bg}-bg"></div>`;
  html+=CHROME+`<div class="content${main.hasAttribute('data-scroll')?' scroll':''}">${main.innerHTML}</div>`;
  if(base)html+=t.innerHTML;
  const tab=main.dataset.tab;if(tab)html+=tabbar(tab,FLOWS[this.flow]&&FLOWS[this.flow].tabs);
  html+='<div class="home-ind"></div>';
  const layer=document.createElement('div');layer.className='layer'+(main.dataset.cls?' '+main.dataset.cls:'')+(base?' has-sheet':'')+(t.dataset.cls&&base?' '+t.dataset.cls:'');layer.innerHTML=html;return layer;}
 go(id,dir){dir=dir||'push';const layer=this.build(id);if(!layer)return;const old=$$('.layer',this.screen).pop();
  if(dir==='push'&&this.cur&&this.cur!==id)this.hist.push(this.cur);
  if(dir==='push')layer.classList.add('in');else if(dir==='back')layer.classList.add('inb');
  this.screen.appendChild(layer);this.enhance(layer);
  if(old){old.classList.add(dir==='back'?'outb':'out');setTimeout(()=>old.remove(),RM?0:300);}
  this.cur=id;this.emit();}
 back(){if(!this.hist.length)return;const id=this.hist.pop();this.go(id,'back');}
 reset(){this.hist=[];const f=FLOWS[this.flow];this.go(f.steps[0].id,'none');}
 setFlow(k){this.flow=k;this.reset();}
 enhance(layer){this.timers.forEach(clearTimeout);this.timers=[];
  $$('[data-count]',layer).forEach(el=>{const v=+el.dataset.count,pre=el.dataset.prefix||'';if(RM){el.textContent=pre+fmt(v);return;}const t0=performance.now(),d=950;const f=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=pre+fmt(v*e);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f);});
  $$('[data-arc]',layer).forEach(c=>{const len=parseFloat(c.dataset.arc),off=parseFloat(c.dataset.off||'0');if(RM){c.setAttribute('stroke-dashoffset',off);return;}c.setAttribute('stroke-dashoffset',off+len);requestAnimationFrame(()=>requestAnimationFrame(()=>c.setAttribute('stroke-dashoffset',off)));});
  $$('[data-reveal]',layer).forEach(el=>this.timers.push(setTimeout(()=>el.classList.add('on'),RM?0:+el.dataset.reveal)));
  $$('[data-hide]',layer).forEach(el=>this.timers.push(setTimeout(()=>{el.hidden=true},RM?0:+el.dataset.hide)));

 function run(){const res=+reserve.value;const idle=400000,sav=450000,dep=1600000,total=idle+sav+dep;const mv=Math.max(0,idle-res);
  const acts=[];if(mv>0)acts.push({t:`${fmt(mv)} ₽ с карты → накопительный счёт`,g:mv*0.1125,m:'в год'});
  if(!block.checked)acts.push({t:'Переоткрыть вклад ••8708 под 12,2% вместо 7,5%',g:400000*(0.122-0.075)*0.5,m:'за 6 месяцев'});
  if(bonus.checked)acts.push({t:'Надбавка за покупки +1,5% на накопительном (450 000 ₽)',g:sav*0.015,m:'в год'});
  const th=+thr.value;const kept=acts.filter(a=>a.g/12>=th);const dropped=acts.length-kept.length;const tot=kept.reduce((s,a)=>s+a.g,0);
  const effB=(sav+1200000)/total;const effA=(sav+mv+(block.checked?0:400000)+800000+400000)/total;
  $('#c-reserve-v').textContent=fmt(res)+' ₽';
  $('#c-acts').innerHTML=kept.map(a=>`<div class="o"><span>${a.t}</span><b>+${fmt(a.g)} ₽ <span style="font-weight:400;color:var(--ink3)">${a.m}</span></b></div>`).join('')+(dropped?`<div class="o" style="color:var(--ink3)"><span>Скрыто предложений ниже порога выгоды</span><b>${dropped}</b></div>`:'');
  $('#c-total').textContent='+'+fmt(tot)+' ₽';$('#c-eff').textContent=Math.round(effB*100)+'% → '+Math.round(effA*100)+'%';
  const idleA=idle-mv,savA=sav+mv;
  $('#c-before').innerHTML=`<i class="idle" style="width:${idle/total*100}%"></i><i class="sav" style="width:${sav/total*100}%"></i><i class="dep" style="width:${dep/total*100}%"></i>`;

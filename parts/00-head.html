<title>Помощник по сбережениям</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500..800&family=Inter:wght@400..700&display=swap">
<style>
/* Layout: long-form interactive page; light neutral editorial deck with a green accent; a live iPhone 18 Pro Max prototype (440×956 pt canvas) rendered at native size and scaled to fit. */
:root{
  --bg:#F5F7F4; --bg2:#EBEFE9; --surface:#FFFFFF; --ink:#111815; --ink2:#3E4944; --ink3:#6E7A74; --line:#DCE3DE;
  --accent:#157A36; --accent2:#0E5A28; --accent-soft:#DDF0E3; --ai:#6246EA; --ai-soft:#ECE8FF; --warn:#B45309; --warn-soft:#FBEEDC;
  --dark:#0F1F17; --on-dark:#F2F5F1; --on-dark2:#A9B8AE;
  --c-idle:#B45309; --c-sav:#1D6FA5; --c-dep:#157A36;
  --display:'Manrope',Arial,sans-serif; --text:'Inter',Arial,sans-serif; --ui:'Inter',-apple-system,'SF Pro Text',Arial,sans-serif;
  --maxw:1440px; --k:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --bg2:#121B17; --surface:#182219; --ink:#EEF3EF; --ink2:#C3CDC6; --ink3:#8C9A92; --line:#26332B;
  --accent:#5BD67E; --accent2:#8BE5A4; --accent-soft:#163A24; --ai:#A48BFF; --ai-soft:#2A2350; --warn:#E7A24A; --warn-soft:#3A2A12;
  --dark:#060A08; --on-dark:#F2F5F1; --on-dark2:#A9B8AE; --c-idle:#D99A3A; --c-sav:#4FA3E6; --c-dep:#3DBD68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --bg2:#121B17; --surface:#182219; --ink:#EEF3EF; --ink2:#C3CDC6; --ink3:#8C9A92; --line:#26332B;
  --accent:#5BD67E; --accent2:#8BE5A4; --accent-soft:#163A24; --ai:#A48BFF; --ai-soft:#2A2350; --warn:#E7A24A; --warn-soft:#3A2A12;
  --dark:#060A08; --on-dark:#F2F5F1; --on-dark2:#A9B8AE; --c-idle:#D99A3A; --c-sav:#4FA3E6; --c-dep:#3DBD68; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--text);line-height:1.5;padding-inline:0;font-size:17px}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:clamp(16px,4vw,56px)}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* top nav */
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topnav .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{white-space:nowrap;font-size:14px;font-weight:600;color:var(--ink2);padding:7px 11px;border-radius:999px;text-decoration:none}
.links a:hover,.links a.on{background:var(--accent-soft);color:var(--accent)}
.links a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* sections */
section.s{padding-block:clamp(56px,7vw,104px);border-top:1px solid var(--line)}
section.s.alt{background:var(--bg2)}
section.s.dark{background:var(--dark);color:var(--on-dark)}
.hd{display:flex;flex-direction:column;gap:12px;margin-bottom:clamp(28px,3vw,44px);max-width:1100px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.dark .eyebrow{color:#5BD67E}
h2.t{font-family:var(--display);font-size:clamp(30px,3.4vw,46px);font-weight:700;line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
h3{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25}
.lead{font-size:clamp(18px,1.4vw,21px);line-height:1.5;color:var(--ink2);max-width:900px}
.dark .lead{color:var(--on-dark2)}
p.b{font-size:17px;line-height:1.5;color:var(--ink2)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.c{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 26px;min-width:0}
.c h3{margin-bottom:8px}
.c p{color:var(--ink2);font-size:16px;line-height:1.5}
.c .num{font-family:var(--display);font-size:clamp(34px,3vw,48px);font-weight:800;color:var(--accent);line-height:1.05;letter-spacing:-.02em;margin-bottom:8px}
.c.ai{border-color:color-mix(in srgb,var(--ai) 40%,var(--line))}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;font-size:13px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.ai{background:var(--ai-soft);color:var(--ai)}
.pill.nat{background:var(--accent-soft);color:var(--accent)}
.pill.trust{background:var(--warn-soft);color:var(--warn)}
.pill.g{background:var(--bg2);color:var(--ink2)}
.band{background:var(--dark);color:var(--on-dark);border-radius:22px;padding:28px 34px;display:flex;gap:22px;align-items:center;margin-top:24px}
.band i{width:6px;align-self:stretch;border-radius:3px;background:#5BD67E;flex:none}
.band p{font-size:clamp(18px,1.5vw,22px);line-height:1.45}
.src{font-size:14px;color:var(--ink3);margin-top:14px}
.list{display:flex;flex-direction:column;gap:12px}
.li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;color:var(--ink2)}
.li .ic{margin-top:3px;color:var(--accent)}
.li.w .ic{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;line-height:1.45}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:14px 14px;border-bottom:1px solid var(--line)}
.tbl th{font-weight:700;color:var(--ink);background:var(--bg2);font-size:14px}
.tbl td{color:var(--ink2)}
.tbl td b{color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.tbl code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;background:var(--bg2);padding:2px 6px;border-radius:6px;color:var(--ink)}
/* hero */
.hero{padding-block:clamp(40px,6vw,88px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,4vw,64px);align-items:center}
@media (max-width:980px){.hero .wrap{grid-template-columns:minmax(0,1fr)}}
h1.h{font-family:var(--display);font-size:clamp(38px,5vw,72px);font-weight:800;line-height:1.02;letter-spacing:-.025em;text-wrap:balance}
.hero .lead{margin-top:20px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn-p,.btn-s{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:24px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:var(--text)}
.btn-p{background:var(--accent);color:#fff}
.btn-s{background:var(--surface);color:var(--ink);border-color:var(--line)}
.hero .facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:36px}
.hero .facts div{font-size:14px;color:var(--ink3)}
.hero .facts b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);font-weight:800}
.hero-phone{display:flex;justify-content:center}
/* stages flow */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative}
@media (max-width:980px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.stages{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stage .yr{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.stage h3{font-size:24px}
.stage .q{font-size:15px;color:var(--ink);background:var(--bg2);border-radius:12px;padding:10px 12px;font-style:italic}
.stage p{font-size:15px;color:var(--ink2);line-height:1.5}
.stage .lvl{margin-top:auto}
/* matrix */
.matrix{display:grid;grid-template-columns:150px repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.matrix{grid-template-columns:1fr}.matrix .mh,.matrix .mr{display:none}}
.matrix .mh{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:6px 4px;align-self:end}
.matrix .mh b{display:block;font-family:var(--display);font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:2px}
.matrix .mr{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:18px 4px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.matrix .mr b{font-family:var(--display);font-size:18px;letter-spacing:0;text-transform:none;color:var(--ink)}
.matrix .cell{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.45;color:var(--ink2);display:flex;flex-direction:column;gap:8px;min-width:0}
.matrix .cell b{color:var(--ink);font-size:15px}
.matrix .cell .tag{display:inline-flex;gap:6px;flex-wrap:wrap}
/* ladder */
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
@media (max-width:900px){.ladder{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.ladder{grid-template-columns:1fr}}
.rung{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:8px}
.rung .lv{font-family:var(--display);font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.rung h3{font-size:20px}
.rung p{font-size:15px;color:var(--ink2);line-height:1.45}
.rung .who{font-size:13px;color:var(--ink3);margin-top:6px}
.rung.r2{padding-top:44px}.rung.r3{padding-top:68px}.rung.r4{padding-top:92px}
@media (max-width:900px){.rung.r2,.rung.r3,.rung.r4{padding-top:20px}}
/* prototype */
.proto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,3vw,48px);align-items:start}
@media (max-width:980px){.proto{grid-template-columns:minmax(0,1fr)}}
.personas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.personas button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:600 14px var(--text);padding:9px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.personas button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.personas button i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.stage-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;min-width:0}
.ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctl button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:600 13px var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ctl button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.rail{display:flex;flex-direction:column;gap:8px}
.rail .st{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid transparent;cursor:pointer;background:transparent}
.rail .st:hover{background:var(--surface);border-color:var(--line)}
.rail .st.on{background:var(--surface);border-color:var(--accent)}
.rail .st .n{width:28px;height:28px;border-radius:50%;background:var(--bg2);color:var(--ink2);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.rail .st.on .n{background:var(--accent);color:#fff}
.rail .st.done .n{background:var(--accent-soft);color:var(--accent)}
.rail .st b{display:block;font-size:15px;color:var(--ink)}
.rail .st span{font-size:14px;color:var(--ink2);line-height:1.45}
.notes{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.note p{font-size:15px;line-height:1.5;color:var(--ink2)}
.hint{font-size:13.5px;color:var(--ink3);text-align:center;max-width:min(420px,100%)}
/* console (MCP demo) */
.console{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) auto;gap:22px;align-items:start}
@media (max-width:1100px){.console{grid-template-columns:minmax(0,1fr)}}
.reqs{display:flex;flex-direction:column;gap:8px}
.reqs button{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--text);padding:12px 14px;border-radius:14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.reqs button .pill{margin-left:auto}
.reqs button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.trace{background:#0B1410;color:#D6E3DA;border-radius:18px;padding:18px 20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.6;min-height:420px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.trace .l{display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.trace .l.in{opacity:1;transform:none}
.trace .l .tt{flex:none;width:92px;font-weight:700;color:#8FB8A0}
.trace .l.ok .tt{color:#5BD67E}.trace .l.no .tt{color:#F0A868}.trace .l.app .tt{color:#C9B8FF}.trace .l.llm .tt{color:#8FD3FF}
.trace .l .tx{white-space:pre-wrap;word-break:break-word}
.trace .l .tx em{color:#9FB3A8;font-style:normal}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:stretch}
@media (max-width:1100px){.pipe{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:700px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pipe .p{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.pipe .p b{font-size:14.5px;color:var(--ink);line-height:1.3}
.pipe .p span{font-size:13px;color:var(--ink2);line-height:1.4}
.pipe .p .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.pipe .p.ai{border-color:color-mix(in srgb,var(--ai) 45%,var(--line))}.pipe .p.ai .k{color:var(--ai)}
.pipe .p.nat{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.pipe .p.nat .k{color:var(--accent)}
/* engine calc */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.calc{grid-template-columns:minmax(0,1fr)}}
.calc .ctrl{display:flex;flex-direction:column;gap:14px}
.calc label{display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--ink2)}
.calc label b{color:var(--ink)}
.calc input[type=range]{width:100%;accent-color:var(--accent)}
.calc .sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--ink);padding:10px 0;border-bottom:1px solid var(--line)}
.calc .out{display:flex;flex-direction:column;gap:10px}
.calc .o{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink2)}
.calc .o b{color:var(--ink);white-space:nowrap}
.calc .tot{font-family:var(--display);font-size:34px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
.alloc{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;background:var(--bg2)}
.alloc i{display:block;height:100%}
.alloc .idle{background:var(--c-idle)}.alloc .sav{background:var(--c-sav)}.alloc .dep{background:var(--c-dep)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* refs */
.refs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.refs{grid-template-columns:1fr}}
.refs a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink);text-decoration:none}
.refs a b{display:block;color:var(--accent);font-size:13px;margin-bottom:2px}
footer{padding-block:40px;border-top:1px solid var(--line);font-size:14px;color:var(--ink3)}
/* phone mockups: native canvas 440×956 pt (iPhone 18 Pro Max class) */
.ph-wrap{position:relative;flex:none;width:calc(472px*var(--k,1));height:calc(988px*var(--k,1));max-width:100%}
.phone{position:absolute;top:0;left:0;width:472px;height:988px;transform:scale(var(--k,1));transform-origin:top left;border-radius:80px;background:#0B0B0C;padding:16px;box-shadow:0 0 0 1.5px #5A5A60,0 0 0 4px #17171A,0 36px 72px rgba(0,0,0,.32)}
.screen{position:relative;width:440px;height:956px;border-radius:64px;overflow:hidden;background:#000;color:#FFFFFF;font-family:var(--ui);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;text-align:left}
.screen *{box-sizing:border-box}
.screen a{color:inherit;text-decoration:none}
.layer{position:absolute;inset:0;background:#000;border-radius:64px;overflow:hidden}
.layer.in{animation:slin .28s cubic-bezier(.2,.8,.2,1)}
.layer.inb{animation:slinb .28s cubic-bezier(.2,.8,.2,1)}
.layer.out{animation:slout .28s cubic-bezier(.2,.8,.2,1) forwards}
.layer.outb{animation:sloutb .28s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes slin{from{transform:translateX(100%)}to{transform:none}}
@keyframes slinb{from{transform:translateX(-30%);opacity:.6}to{transform:none;opacity:1}}
@keyframes slout{to{transform:translateX(-30%);opacity:.5}}
@keyframes sloutb{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.layer.in,.layer.inb,.layer.out,.layer.outb{animation:none}}
.island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:9;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.sb{position:absolute;top:0;left:0;right:0;height:62px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 36px 8px 44px;font-size:17px;font-weight:600;z-index:8;letter-spacing:-.01em;pointer-events:none}
.sb .st{display:flex;gap:6px;align-items:center}
.sb .st svg{height:13px;width:auto;display:block}
.home-ind{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:150px;height:5px;border-radius:3px;background:#fff;z-index:9;pointer-events:none}
.content{position:absolute;inset:0;padding:74px 20px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.content.scroll{overflow-y:auto;scrollbar-width:none;padding-bottom:140px}
.content.scroll::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:30px;height:86px;border-radius:43px;background:rgba(38,38,42,.96);display:flex;padding:7px;z-index:8;backdrop-filter:blur(18px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:#F2F2F7;border-radius:36px;letter-spacing:-.01em;cursor:pointer}
.tab.on{background:#0B0B0C}
.tab .ic{width:27px;height:27px;stroke-width:1.8}
[data-go],[data-back],[data-sheet],[data-close]{cursor:pointer}
